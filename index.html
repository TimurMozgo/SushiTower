<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#29a9d5"><title>Sushi Tower</title><link rel="stylesheet" href="style-v2.css?v=7"></head>
<body><main id="viewport"><div id="game" aria-label="Sushi Tower — игровой экран">
<img class="backdrop" src="art/Backgrounds/Backgrounds.png" alt="Город и дорога" draggable="false">
<img class="cloud cloud-a" src="art/Backgrounds/Clouds.png" alt=""><img class="cloud cloud-b" src="art/Backgrounds/Clouds.png" alt=""><img class="cloud cloud-c" src="art/Backgrounds/Clouds.png" alt="">
<header class="hud"><div class="district" id="district" aria-label="Текущий район"><img src="art/Ui and PopUp/HubAreaBar.png" alt=""><span>CENTER PARK</span></div><div class="currency gems"><img class="bar" src="art/Ui and PopUp/HudCoinBar.png" alt=""><img class="currency-icon" src="art/Ui and PopUp/GemsIcon.png" alt="Самоцветы"><b id="gems">0</b></div><div class="currency coins"><img class="bar" src="art/Ui and PopUp/HudCoinBar.png" alt=""><img class="currency-icon" src="art/Ui and PopUp/CoinIcon.png" alt="Монеты"><b id="coins">0</b></div><button id="settings" class="settings image-button" aria-label="Настройки и правила"><img src="art/Ui and PopUp/SettingIcon.png" alt=""></button></header>
<div id="rush-hud" hidden><img src="art/Ui and PopUp/Btn_Orange.png" alt=""><b id="rush-timer"></b><span id="rush-score"></span><div class="rush-track"><img src="art/Ui and PopUp/VolumeBar_Bg.png" alt=""><div id="rush-fill"><img src="art/Ui and PopUp/VolumeBar_Yellow.png" alt=""></div></div></div>
<div id="tower"><div id="floors"></div><div class="cashier"><img id="cashier-art" src="art/Cashiers/CashierL6.png" alt="Касса Sushi Tower"><img id="cashier-person" src="art/Cashier Girl/ChashierGirl-animation_00.png" alt="Кассир"><button class="floor-orders" id="cashier-orders" aria-label="Выдача заказов и улучшение кассы"><img src="art/Ui and PopUp/BtnUp.png" alt=""></button></div><img id="lift-cable" src="art/LiftCable.png" alt="Трос лифта"><button id="lift" aria-label="Лифт — улучшить и ускорить"><img class="cabin" src="art/Lift.png" alt="Кабина лифта"><img class="lift-person" id="lift-person" src="art/Lift Guy/Lift Guy-animation_00.png" alt="Работник лифта"></button></div>
<div id="traffic" aria-label="Очередь машин"></div><div id="earnings" aria-live="polite"></div><div id="toast" hidden></div>
<nav class="bottom"><button id="rush" class="rush-button"><img class="button-art" src="art/Ui and PopUp/Btn_Boost.png" alt=""><img class="boost-icon" src="art/Ui and PopUp/Boost_Icon.png" alt=""><span id="rush-label">ЧАС ПИК</span><small id="boost-note"></small></button><button id="map" class="nav-icon" aria-label="Карта и строительство кафе"><img src="art/Ui and PopUp/MapIcon.png" alt=""><span>КАРТА</span></button><button id="shop" class="nav-icon"><img src="art/Ui and PopUp/ShopIcon.png" alt=""><span>МАГАЗИН</span></button></nav>
<div class="studio-credit">Разработано командой <b>Tinellab</b></div>
<section id="overlay" hidden><div class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title"><img class="popup-art" src="art/Ui and PopUp/PopUp_Box.png" alt=""><button class="close image-button" id="close" aria-label="Закрыть"><img src="art/Ui and PopUp/Btn_Close.png" alt=""></button><h1 id="popup-title"></h1><div id="popup-content"></div></div></section>
</div></main><script src="network.js?v=7"></script><script src="sound.js?v=7"></script><script src="music.js?v=7"></script><script src="game-v2.js?v=7"></script></body></html>
